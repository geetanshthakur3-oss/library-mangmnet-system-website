<style>
:root{--paper:#EDEBE6;--sheet:#F4F2ED;--ink:#141414;--muted:#6D6A63;--cobalt:#1F3FB0;--rule:rgba(20,20,20,.9);--ease:cubic-bezier(.2,.8,.2,1);--H:400px;--ws:68px;--d:210px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media (max-width:767px){:root{--H:240px}.bar{height:calc(64px + env(safe-area-inset-top,0px));padding-left:16px;padding-right:16px}.bar>.lbl:last-child{display:none}.bar{height:calc(96px + env(safe-area-inset-top,0px));grid-template-columns:1fr;justify-items:center;align-content:center;gap:10px}.bar>div:first-child{order:2}.bar .logo{order:1}.bar .box{white-space:nowrap}.logo b{font-size:17px}.logo span{font-size:7.5px}.tabs button{padding:0 7px;font-size:9px}.tabs{top:calc(50% - var(--H)/2 - 70px)}#ct{font-size:24px}.ft{left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}.ft .lbl{font-size:9px}#pv{left:6px!important}#nx{right:6px!important;left:auto!important}#det{grid-template-columns:1fr;overflow-y:auto;padding:84px 22px 40px;gap:24px}#det .x{left:16px;top:21px}.pw{order:-1;height:46svh}.col{margin:0}#dt{font-size:42px}#dsy{font-size:16px}}

function barSVG(r){if((document.host?document.host.clientWidth:1000)<700)return barCompact(r);const mx=Math.max(3,...r.map(x=>x.n)),st=mx<=5?1:Math.ceil(mx/5),M=Math.ceil(mx/st)*st,X0=230,W=380,RH=54,H=r.length*RH+46,sx=v=>X0+v/M*W;

function barCompact(r){const mx=Math.max(3,...r.map(x=>x.n)),st=mx<=5?1:Math.ceil(mx/5),M=Math.ceil(mx/st)*st,X0=14,W=290,RH=64,H=r.length*RH+34,sx=v=>X0+v/M*W;

function colSVG(w){const mx=Math.max(3,...w),st=mx<=5?1:Math.ceil(mx/5),M=Math.ceil(mx/st)*st,L=34,PW=270,PH=150,T=16,lab=['3 wks ago','2 wks ago','Last week','This week'],sy=v=>T+PH-v/M*PH;

function lineSVG(a){const cp=(document.host?document.host.clientWidth:1000)<700,VW=cp?360:640,mx=Math.max(3,...a),st=mx<=5?1:Math.ceil(mx/5),M=Math.ceil(mx/st)*st,L=34,R=VW-20,T=14,B=190,x=i=>L+i/(a.length-1)*(R-L),y=v=>B-v/M*(B-T),dl=i=>new Date(now()-(29-i)*DAY).toLocaleDateString(undefined,{day:'numeric',month:'short'});

const VW={notes:vNotes,home:vHome,seat:vSeat,buy:vBuy,orders:vOrders,study:vStudy,help:vHelp};
function render(){S=ld()||{cfg:{name:'City Central Library',fine:2,days:14},books:[],members:[],loans:[]};
let id=null;try{id=lsGet('lms2_stu',1)}catch(e){}
me=id?S.members.find(m=>m.id===id):null;
$('#login').hidden=!!me;$('#app').hidden=!me;$('#llogo').innerHTML=$('#alogo').innerHTML=IC;$('#lname').textContent=$('#aname').textContent=S.cfg.name;
if(!me)return;
$('#who').textContent=me.name;$('#pt').textContent='Hello, '+me.name.split(' ')[0];
autoRemind();const un=(S.notes||[]).filter(n=>n.memberId===me.id&&!n.read).length;
$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}${k==='notes'&&un&&tab!=='notes'?' ('+un+')':''}</button>`).join('');
$('#view').innerHTML=VW[tab]()}
function setMode(m){mode=m;$('#lf').querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));const up=m==='up';
$('#ln').hidden=!up;$('#lph').hidden=!up;$('#lh').textContent=up?'Create your student account':'Student sign in';$('#lbtn').textContent=up?'Create account':'Sign in';$('#lhint').textContent=up?'Use a password of 6 or more characters.':'';$('#lerr').textContent=''}
function enter(id){lsSet('lms2_stu',id,1);$('#lf').reset();$('#lerr').textContent='';tab='home';render()}
$('#lf').querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)};
$('#lf').onsubmit=e=>{e.preventDefault();S=ldS();const d=new FormData(e.target),u=d.get('u').trim().toLowerCase(),p=d.get('p'),err=$('#lerr');
if(mode==='in'){const m=S.members.find(x=>(x.email||'').toLowerCase()===u&&(x.pw||'student123')===p);if(!m){err.textContent='Wrong email or password.';return}enter(m.id)}
else{const n=d.get('n').trim();if(!n||!u){err.textContent='Enter your name and email.';return}if(p.length<6){err.textContent='Use a password of 6 or more characters.';return}
if(S.members.some(x=>(x.email||'').toLowerCase()===u)){err.textContent='An account with this email already exists. Sign in instead.';return}
const ph=(d.get('ph')||'').trim();if(ph&&!/^\+?[0-9 ()-]{8,15}$/.test(ph)){err.textContent='Enter a valid phone number or leave it empty.';return}
const m={id:uid('m'),name:n,email:d.get('u').trim(),joined:now(),pw:p,phone:ph};S.members.push(m);save();toast('Account created. Welcome!');enter(m.id)}};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;q='';render()}};
const ACT={review:id=>{S=ldS();const b=book(id);if(!b||!S.loans.some(l=>l.memberId===me.id&&l.bookId===id))return toast('Only students who have borrowed this book can review it.');const my=(S.reviews||[]).find(r=>r.memberId===me.id&&r.bookId===id);
modal('Review '+esc(b.title),[{k:'rt',l:'Your rating',o:[['5','5 out of 5, excellent'],['4','4 out of 5, good'],['3','3 out of 5, okay'],['2','2 out of 5, poor'],['1','1 out of 5, very poor']],v:my?String(my.rating):'5'},{k:'tx',l:'Your review (optional)',w:1,ta:4,v:my?my.text||'':''}],'Save review',d=>{const rt=parseInt(d.rt,10);if(!(rt>=1&&rt<=5)){toast('Pick a rating.');return false}if(d.tx.length>600){toast('Keep the review under 600 characters.');return false}
S=ldS();const list=S.reviews=S.reviews||[],ex=list.find(r=>r.memberId===me.id&&r.bookId===id);if(ex){ex.rating=rt;ex.text=d.tx.trim();ex.at=now()}else list.push({id:uid('r'),bookId:id,memberId:me.id,rating:rt,text:d.tx.trim(),at:now()});save();render();toast('Thanks for your review.')},'Your first name, rating and review will be shown next to this book on the library website.')},
copyUpi:()=>{try{navigator.clipboard.writeText(S.cfg.upiId).then(()=>toast('UPI ID copied.'),()=>toast('Could not copy. Select the UPI ID and copy it by hand.'))}catch(e){toast('Could not copy. Select the UPI ID and copy it by hand.')}},
claim:()=>{S=ldS();const sh=shOf(me),ms=[...document.querySelectorAll('input[name=cm]:checked')].map(x=>x.value),u=($('#utr').value||'').trim();if(!sh)return;
if(!ms.length)return toast('Pick at least one month.');if(!/^\d{12}$/.test(u))return toast('Enter the 12 digit UPI reference number.');
if((S.claims||[]).some(c=>c.utr===u&&c.status!=='Rejected'))return toast('That reference number was already submitted.');
(S.claims=S.claims||[]).push({id:uid('c'),memberId:me.id,months:ms,amount:ms.length*sh.fee,utr:u,at:now(),status:'Pending'});save();toast('Sent. Staff will confirm your payment.');render()},
sendT:()=>{const sb=$('#ts').value.trim(),m=$('#tm').value.trim();if(!sb||!m)return toast('Add a subject and describe the problem.');S=ldS();(S.tickets=S.tickets||[]).push({id:uid('t'),memberId:me.id,category:$('#tc').value,subject:sb,message:m,status:'Open',replies:[],at:now()});save();toast('Sent. The library will reply here.');render()},
closeT:id=>{S=ldS();S.tickets.find(x=>x.id===id).status='Resolved';save();toast('Marked as resolved.');render()},pick:n=>{sel.seat=+n;render()},
book:()=>{S=ldS();const sl=SL[sel.slot],all=S.seats=S.seats||[];if(sel.date<iso(new Date()))return toast('Pick today or a later date.');
if(all.some(x=>x.date===sel.date&&x.slot===sl&&x.seat===sel.seat))return toast('That seat was just taken. Pick another.');
if(all.some(x=>x.date===sel.date&&x.slot===sl&&x.memberId===me.id))return toast('You already have a seat for this time slot.');
all.push({id:uid('s'),memberId:me.id,date:sel.date,slot:sl,seat:sel.seat,at:now()});save();toast(`Seat ${sel.seat} booked for ${sel.date}, ${sl}.`);sel.seat=null;render()},
cxSeat:id=>{S=ldS();S.seats=(S.seats||[]).filter(x=>x.id!==id);save();toast('Booking cancelled.');render()},
buy:id=>{S=ldS();const b=book(id);if(!b||stock(b)<1)return toast('Sorry, that book is out of stock.');b.stock=stock(b)-1;b.price=price(b);(S.orders=S.orders||[]).push({id:uid('o'),memberId:me.id,bookId:id,qty:1,total:price(b),status:'Reserved',at:now()});save();toast(`Reserved. Pay ₹${price(b)} at the library desk.`);render()},
cxOrder:id=>{S=ldS();const o=S.orders.find(x=>x.id===id);if(!o||o.status!=='Reserved')return;o.status='Cancelled';const b=book(o.bookId);if(b)b.stock=stock(b)+o.qty;save();toast('Order cancelled.');render()}};
$('#view').onclick=e=>{const t=e.target.closest('[data-a]');if(t&&ACT[t.dataset.a])ACT[t.dataset.a](t.dataset.id)};
$('#view').addEventListener('change',e=>{if(e.target.id==='sd'){sel.date=e.target.value||sel.date;sel.seat=null;render()}if(e.target.id==='ss'){sel.slot=+e.target.value;sel.seat=null;render()}});
$('#view').addEventListener('input',e=>{if(e.target.dataset.f){q=e.target.value;$('#tbl').innerHTML=buyTbl()}});
$('#lo').onclick=()=>{lsDel('lms2_stu',1);render()};
document.host.addEventListener('show',render);
render();
})(SR2);
</script>
